[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tprm"
version = "0.1.0"
description = "Privacy-Preserving Vendor Risk (TPRM) Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "typer==0.12.3",
    "python-multipart==0.0.9",
    # Data models
    "pydantic==2.7.4",
    "pydantic-settings==2.3.1",
    # Document parsing
    "pymupdf==1.24.5",
    "python-docx==1.1.2",
    "openpyxl==3.1.4",
    "pytesseract==0.3.10",
    "Pillow==10.4.0",
    # PII detection
    "presidio-analyzer==2.2.354",
    "presidio-anonymizer==2.2.354",
    "spacy==3.7.5",
    # NLP / embeddings
    "sentence-transformers==3.0.1",
    "numpy==1.26.4",
    # Crypto + security
    "cryptography==42.0.8",
    "python-dotenv==1.0.1",
    # LLM
    "langchain>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-core>=0.3.0",
    "json-repair>=0.25.2",
    # Database
    "sqlalchemy==2.0.31",
    "asyncpg==0.29.0",
    "alembic==1.13.2",
    # HTTP client
    "httpx==0.27.0",
    # Logging
    "structlog==24.2.0",
    # Config
    "pyyaml==6.0.1",
    "python-magic==0.4.27",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "hypothesis==6.104.2",
    "ruff==0.5.0",
    "mypy==1.10.1",
    "types-PyYAML==6.0.12.20240311",
    "types-Pillow==10.2.0.20240520",
    "httpx==0.27.0",
    "faker==25.9.1",
    "reportlab==4.2.2",
]

[project.scripts]
tprm = "tprm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tprm"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "TCH",      # flake8-type-checking
    "ANN",      # flake8-annotations
    "S",        # flake8-bandit (security)
    "RUF",      # ruff-specific
]
ignore = [
    "ANN101",   # missing type annotation for self
    "ANN102",   # missing type annotation for cls
    "S101",     # use of assert (needed in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "fitz",
    "fitz.*",
    "docx",
    "docx.*",
    "openpyxl",
    "openpyxl.*",
    "pytesseract",
    "presidio_analyzer",
    "presidio_analyzer.*",
    "presidio_anonymizer",
    "presidio_anonymizer.*",
    "spacy",
    "spacy.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "langchain",
    "langchain.*",
    "langchain_ollama",
    "langchain_core",
    "langchain_core.*",
    "json_repair",
    "magic",
    "reportlab",
    "reportlab.*",
    "faker",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Current tests cover the core unit/security paths; raise this as broader
# API, orchestration, NLP, and risk-module tests are added.
addopts = "--cov=src/tprm --cov-report=term-missing --cov-fail-under=45"

[tool.coverage.run]
source = ["src/tprm"]
omit = ["*/migrations/*", "*/alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
